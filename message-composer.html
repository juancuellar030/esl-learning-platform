<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="assets/graduation-cap-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Message - ESL Learning Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/message-composer.css">
</head>

<body>
    <!-- Header -->
    <header class="main-header">
        <div class="container">
            <h1><i class="fa-solid fa-graduation-cap"></i> ESL Learning Platform</h1>
            <p class="tagline">Broadcast Message Tool</p>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="main-nav">
        <div class="container">
            <a href="tools.html" class="nav-btn" style="text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Back to Tools
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="tool-card">
                <div class="composer-layout">
                    <div class="composer-form">
                        <h2><i class="fa-solid fa-bullhorn"></i> Compose Message</h2>

                        <div class="form-group">
                            <label for="message-text">Message Text</label>
                            <textarea id="message-text" placeholder="Type your broadcast message…" rows="4"></textarea>
                        </div>

                        <div class="form-group">
                            <label>Quick Presets</label>
                            <div class="preset-buttons" id="preset-buttons"></div>
                        </div>

                        <div class="form-group">
                            <label>Message Color</label>
                            <div class="color-swatches" id="color-swatches"></div>
                        </div>

                        <div class="form-group">
                            <label>Font Size</label>
                            <div class="size-options" id="size-options"></div>
                        </div>

                        <div class="form-group">
                            <label for="animation-select">Animation Style</label>
                            <select id="animation-select">
                                <option value="none">None</option>
                                <option value="pulse">Pulse</option>
                                <option value="shake">Shake</option>
                                <option value="flash">Flash</option>
                            </select>
                        </div>

                        <button type="button" class="btn-primary btn-generate" id="generate-link-btn">
                            <i class="fa-solid fa-link"></i> Generate Broadcast Link
                        </button>

                        <div class="form-group" style="margin-top: 20px;">
                            <label for="broadcast-link">Broadcast Link</label>
                            <div class="link-output">
                                <input type="text" id="broadcast-link" readonly
                                    placeholder="Generate a link to share with student PCs…">
                                <button type="button" class="btn-secondary" id="copy-link-btn">
                                    <i class="fa-solid fa-copy"></i> Copy Link
                                </button>
                            </div>
                            <div class="copy-feedback" id="copy-feedback">Copied!</div>
                        </div>

                        <div class="recent-messages">
                            <h3><i class="fa-solid fa-clock-rotate-left"></i> Recent Messages</h3>
                            <div class="recent-buttons" id="recent-buttons"></div>
                        </div>
                    </div>

                    <div class="preview-panel">
                        <h2><i class="fa-solid fa-eye"></i> Live Preview</h2>
                        <div class="preview-box">
                            <div class="preview-screen" id="preview-screen">Your message preview…</div>
                        </div>
                        <p class="preview-hint">Scaled preview — actual broadcast fills the entire screen</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>ESL Learning Platform © 2025 | Made for Teachers, by Teachers</p>
        </div>
    </footer>

    <script src="js/message-composer.js"></script>
    <script src="js/darkmode.js"></script>
</body>

</html>
